# Cloudflare Tunnel ingress template.
#
# Two ingress rules per the recipe:
#   1. /health  → upstream agent (so uptime monitors see real health).
#   2. catch  → upstream on the same hostname.
# The trailing http_status:404 is mandatory.

tunnel: ${TUNNEL_ID}
credentials-file: /etc/cloudflared/credentials.json

originRequest:
  connectTimeout: 30s
  keepAliveConnections: 4
  keepAliveTimeout: 90s
  httpHostHeader: ${TUNNEL_HOSTNAME}

ingress:
  - hostname: ${TUNNEL_HOSTNAME}
    service: http://<AGENT>:PORT              # e.g. http://hermes:8642
  - service: http_status:404
